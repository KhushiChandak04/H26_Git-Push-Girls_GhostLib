[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostlib"
version = "0.2.0"
description = "Evidence-first dependency resilience and migration analysis"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "packaging>=24,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ghostlib = "app.cli:main"

[tool.setuptools.package-dir]
"" = "backend"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
norecursedirs = ["targets", "artifacts", "frontend", ".git", ".venv", "node_modules"]
